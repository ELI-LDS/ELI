name: Sync Notion tasks from PR links

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-notion-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Sync tasks with a PR link
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: 3e398345-0279-804c-bfb5-d1e86efbce5f
        with:
          script: |
            if (!process.env.NOTION_TOKEN) {
              core.setFailed('Missing NOTION_TOKEN repository secret.');
              return;
            }

            const headers = {
              Authorization: 'Bearer ' + process.env.NOTION_TOKEN,
              'Notion-Version': '2022-06-28',
              'Content-Type': 'application/json',
            };
            const pages = [];
            let cursor = null;
            do {
              const response = await fetch(
                'https://api.notion.com/v1/databases/' + process.env.NOTION_DATABASE_ID + '/query',
                {
                  method: 'POST',
                  headers,
                  body: JSON.stringify({ page_size: 100, ...(cursor ? { start_cursor: cursor } : {}) }),
                },
              );
              if (!response.ok) {
                core.setFailed('Notion database query failed (' + response.status + '): ' + await response.text());
                return;
              }
              const data = await response.json();
              pages.push(...data.results);
              cursor = data.has_more ? data.next_cursor : null;
            } while (cursor);

            let updated = 0;
            for (const page of pages) {
              const prUrl = page.properties?.['PR 링크']?.url;
              if (!prUrl) continue;

              let url;
              try {
                url = new URL(prUrl);
              } catch {
                core.warning('Skipping invalid PR link on Notion page ' + page.id + '.');
                continue;
              }
              const parts = url.pathname.split('/').filter(Boolean);
              if (url.hostname.toLowerCase() !== 'github.com' || parts.length !== 4 || parts[2] !== 'pull' || !/^[0-9]+$/.test(parts[3]) || parts[0].toLowerCase() !== context.repo.owner.toLowerCase() || parts[1].toLowerCase() !== context.repo.repo.toLowerCase()) {
                core.warning('Skipping invalid or external PR link on Notion page ' + page.id + '.');
                continue;
              }

              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(parts[3]),
              });
              if (pr.state === 'closed' && !pr.merged_at) continue;

              const merged = Boolean(pr.merged_at);
              const currentStatus = page.properties?.['상태']?.status?.name;
              const currentDoneDate = page.properties?.['완료일']?.date?.start;
              const doneDate = merged ? pr.merged_at.slice(0, 10) : null;
              if (currentStatus === (merged ? '완료' : '진행 중') && (!merged || currentDoneDate === doneDate)) continue;

              const properties = { '상태': { status: { name: merged ? '완료' : '진행 중' } } };
              if (merged) properties['완료일'] = { date: { start: doneDate } };

              const response = await fetch('https://api.notion.com/v1/pages/' + page.id, {
                method: 'PATCH',
                headers,
                body: JSON.stringify({ properties }),
              });
              if (!response.ok) {
                core.warning('Could not update Notion page ' + page.id + ': ' + await response.text());
                continue;
              }
              updated += 1;
            }
            core.notice('Synced ' + updated + ' Notion task(s).');
























































































