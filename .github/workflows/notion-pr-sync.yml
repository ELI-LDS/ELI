name: Sync Notion task from pull request

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-notion-task:
    runs-on: ubuntu-latest
    steps:
      - name: Update linked Notion task
        uses: actions/github-script@v7
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const notionUrl = body.match(/https:\/\/(?:www\.)?(?:notion\.so|app\.notion\.com)\/[^\s)]+/i)?.[0];

            if (!notionUrl) {
              core.notice('No Notion task URL in this PR body. Skipping sync.');
              return;
            }
            if (!process.env.NOTION_TOKEN) {
              core.setFailed('Missing NOTION_TOKEN repository secret.');
              return;
            }

            const decodedUrl = decodeURIComponent(notionUrl);
            const rawId = decodedUrl.match(/[0-9a-f]{8}(?:-?[0-9a-f]{4}){3}-?[0-9a-f]{12}/i)?.[0]
              || decodedUrl.match(/[0-9a-f]{32}/i)?.[0];
            if (!rawId) {
              core.setFailed('Could not find a Notion page ID in the PR body URL.');
              return;
            }

            const compactId = rawId.replace(/-/g, '');
            const pageId = compactId.slice(0, 8) + '-' + compactId.slice(8, 12) + '-' + compactId.slice(12, 16) + '-' + compactId.slice(16, 20) + '-' + compactId.slice(20);
            const merged = context.payload.action === 'closed' && pr.merged;
            const properties = {
              'GitHub PR': { url: pr.html_url },
              '상태': { status: { name: merged ? '완료' : '진행 중' } },
            };
            if (merged) {
              properties['완료일'] = { date: { start: new Date().toISOString().slice(0, 10) } };
            }

            const response = await fetch('https://api.notion.com/v1/pages/' + pageId, {
              method: 'PATCH',
              headers: {
                Authorization: 'Bearer ' + process.env.NOTION_TOKEN,
                'Notion-Version': '2022-06-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ properties }),
            });
            if (!response.ok) {
              const error = await response.text();
              core.setFailed('Notion update failed (' + response.status + '): ' + error);
              return;
            }
            core.notice(merged ? 'Notion task marked complete.' : 'Notion task marked in progress.');
