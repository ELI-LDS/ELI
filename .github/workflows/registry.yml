name: Verify component registry

on:
  pull_request:
    paths:
      - '.github/workflows/registry.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - 'packages/ui/**'
      - 'packages/registry/**'
      - 'packages/cli/**'
      - 'packages/harness/**'
      - 'scripts/build-registry.mjs'
      - 'scripts/build-cli.mjs'
      - 'scripts/build-harness.mjs'
      - 'tests/registry/**'
      - 'tests/cli/**'
      - 'tests/harness/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:registry
      - run: pnpm test:harness
      - run: pnpm test:cli
      - run: pnpm test:cli:consumer
      - run: pnpm size:cli
      - uses: actions/upload-artifact@v4
        with:
          name: eli-cli-download-size
          path: |
            .artifacts/cli-download-size/report.json
            .artifacts/cli-download-size/report.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
